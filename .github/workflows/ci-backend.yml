name: CI - Back-end

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build e testes automatizados
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: rachaplus-api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rachaplus_test
          POSTGRES_USER: rachaplus
          POSTGRES_PASSWORD: rachaplus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rachaplus -d rachaplus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_NAME: rachaplus_test
      DB_USER: rachaplus
      DB_PASSWORD: rachaplus
      # Segredo usado apenas no ambiente de CI (não é o segredo de produção)
      JWT_SECRET: ci-test-secret-rachaplus-0123456789-abcdefghijklmnopqrstuvwxyz

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Permissão de execução do Maven Wrapper
        run: chmod +x mvnw

      - name: Build e testes
        run: ./mvnw -B clean verify

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: rachaplus-api/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

