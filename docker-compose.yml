services:
  postgres:
    image: postgres:16
    container_name: rachaplus-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST: ${DB_HOST}
    ports:
      - "5432:5432"
    volumes:
      - rachaplus_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  rachaplus_data: