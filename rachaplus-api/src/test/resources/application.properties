spring.application.name=rachaplus-test

# Configurações do H2 em memória para testes
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Chave secreta de teste segura (mínimo 32 bytes)
api.security.token.secret=chave-secreta-para-os-testes-unitarios-1234567890

# Origens permitidas no CORS
api.cors.allowed-origins=http://localhost:3000

