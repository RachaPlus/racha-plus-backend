spring.application.name=rachaplus-test

# Usa o container PostgreSQL que já sobe no GitHub Actions ou o banco configurado por variáveis de ambiente
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:rachaplus_test}
spring.datasource.username=${DB_USER:rachaplus}
spring.datasource.password=${DB_PASSWORD:rachaplus}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Chave secreta de teste segura (mínimo 32 bytes)
api.security.token.secret=${JWT_SECRET:ci-test-secret-rachaplus-0123456789-abcdefghijklmnopqrstuvwxyz}

# Origens permitidas no CORS
api.cors.allowed-origins=http://localhost:3000
